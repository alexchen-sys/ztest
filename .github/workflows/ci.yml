name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Native test suite
        run: zig build test

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install "pytest>=9,<10"

      - name: Behavioral gate (OSS regression fixtures)
        run: ZTEST_BIN=zig-out/bin/ztest python3 -m pytest tests/test_oss_regressions.py -q

      # Pure-Python regression tests for the wheel builder: ELF architecture
      # identity (aarch64 wheel must not carry an x86_64 payload), filename/tag
      # parsing, and fail-closed verify_wheel. No Zig build involved.
      - name: Wheel builder regression tests
        run: python3 -m pytest scripts/test_build_wheels.py -q

      - name: Docs cross-check (invariant keys and links)
        run: python3 scripts/check_docs.py

      - name: Smoke run
        run: |
          zig-out/bin/ztest --version
          zig-out/bin/ztest --collect-only tests/fixtures/python_files/tests

  # Static musl artifacts must be sterile: no build-host paths, no dynamic
  # interpreter, no debug sections. Every check below is a hard gate — a release
  # that leaks `/home/...`, `/mnt/...`, `/opt/...` or a zig cache path into
  # `strings` fails CI. Released binaries also refuse to contain `ReleaseFast`
  # builds: README and BENCHMARKS describe — and measure — a `ReleaseSafe`
  # binary, so the published artifacts must be the same configuration.
  musl-static:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux-musl
          - arch: aarch64
            target: aarch64-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build static binary (${{ matrix.arch }})
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -p "zig-out-${{ matrix.arch }}"
          ls -l "zig-out-${{ matrix.arch }}/bin/ztest"

      - name: Linkage check (must be fully static)
        run: |
          set -euo pipefail
          BIN="zig-out-${{ matrix.arch }}/bin/ztest"
          file "$BIN" | tee /dev/stderr | grep -q "statically linked"
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "::error::${{ matrix.arch }} binary is dynamically linked"
            ldd "$BIN"
            exit 1
          fi

      - name: Debug-section check (must be stripped)
        run: |
          set -euo pipefail
          BIN="zig-out-${{ matrix.arch }}/bin/ztest"
          if readelf -S "$BIN" | grep -qE '\.debug_(info|line|str)'; then
            echo "::error::debug sections present in ${{ matrix.arch }} release binary"
            readelf -S "$BIN" | grep -E '\.debug_' || true
            exit 1
          fi
          file "$BIN" | grep -qiE 'stripped|no section headers' || {
            echo "::error::$BIN does not report as stripped"
            exit 1
          }

      - name: Sterility check (no build-host paths in strings)
        run: |
          set -euo pipefail
          BIN="zig-out-${{ matrix.arch }}/bin/ztest"
          # Occurrence-level scan, not a line filter: legal runtime literals
          # (/tmp/ztest_{d}_{d}_{x}, bare `zig-cache`) and a real host path can
          # share one `strings` line, so a `grep -v` would either fail on the
          # legal literals or hide the leak. The rules and their self-controls
          # (11 leak / 10 clean cases, including that merged-rodata line) live in
          # scripts/check_sterility.py; the self-test runs before the scan.
          python3 scripts/check_sterility.py --self-test
          python3 scripts/check_sterility.py "$BIN"

      - name: Smoke run (native arch only)
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          BIN="zig-out-${{ matrix.arch }}/bin/ztest"
          "$BIN" --version
          "$BIN" --collect-only tests/fixtures/python_files/tests

      - name: Upload static binary
        uses: actions/upload-artifact@v4
        with:
          name: ztest-static-${{ matrix.arch }}
          path: zig-out-${{ matrix.arch }}/bin/ztest
          if-no-files-found: error

  # Wheels are assembled from the static binaries above, then installed for real
  # into a throwaway venv: `pip install *.whl && ztest --version` must just work.
  wheels:
    runs-on: ubuntu-24.04
    needs: [musl-static]
    env:
      ZTEST_VERSION: "0.5.1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download static binaries
        uses: actions/download-artifact@v4
        with:
          pattern: ztest-static-*
          path: artifacts

      - name: Assemble release tarballs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in x86_64 aarch64; do
            stage="$(mktemp -d)"
            install -m 0755 "artifacts/ztest-static-$arch/ztest" "$stage/ztest"
            cp README.md LICENSE "$stage/"
            tar -czf "dist/ztest-v${ZTEST_VERSION}-linux-$arch.tar.gz" -C "$stage" ztest README.md LICENSE
            rm -rf "$stage"
          done
          # The installer is a release asset: install.sh documents
          # releases/latest/download/install.sh, so it must exist in the published
          # release. It is not checksummed (a bootstrap script cannot verify
          # itself); SHA256SUMS covers the binaries only.
          cp scripts/install.sh dist/install.sh
          chmod 0755 dist/install.sh
          (cd dist && sha256sum ztest-v*-linux-*.tar.gz > SHA256SUMS)
          ls -l dist

      - name: Build wheels
        run: python3 scripts/build_wheels.py --dist dist --verify --version "$ZTEST_VERSION"

      - name: Install x86_64 wheel into a clean venv and run a suite
        run: sh packaging/pypi/smoke_test.sh "$(ls dist/*x86_64.whl)"

      - name: aarch64 wheel integrity (cannot execute natively on this runner)
        run: |
          set -euo pipefail
          WHL="$(ls dist/*aarch64.whl)"
          # verify_wheel re-checks RECORD, the 0755 payload mode, WHEEL tags and
          # the payload's ELF e_machine against the architecture in the filename
          # tags — the only architecture gate available without executing it.
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import build_wheels as bw; from pathlib import Path; bw.verify_wheel(Path(sys.argv[1]))' "$WHL"

      - name: install.sh end-to-end (offline, from dist/)
        run: |
          set -euo pipefail
          sh scripts/install.sh --from-dir dist --install-dir "$RUNNER_TEMP/ztest-bin"
          "$RUNNER_TEMP/ztest-bin/ztest" --version
          "$RUNNER_TEMP/ztest-bin/ztest" --collect-only tests/fixtures/python_files/tests

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ztest-dist-v${{ env.ZTEST_VERSION }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error
